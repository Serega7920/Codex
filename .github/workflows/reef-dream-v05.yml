name: Build Reef Dream 3D APK
on:
  workflow_dispatch:
  push:
    branches: [reef-dream-v05-3d]
    paths:
      - 'reef-dream-v03/**'
      - '.github/workflows/reef-dream-v05.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: reef-dream-v03
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ReefDream-v05-3D-APK
          path: reef-dream-v03/app/build/outputs/apk/debug/*.apk
