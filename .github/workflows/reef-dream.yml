name: Build Reef Dream APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ReefDream/**'
      - '.github/workflows/reef-dream.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        working-directory: ReefDream
        run: |
          gradle --version || true
          gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ReefDream-Android9-APK
          path: ReefDream/app/build/outputs/apk/debug/*.apk
