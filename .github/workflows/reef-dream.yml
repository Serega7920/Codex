name: Build Reef Dream v0.8 APK
on:
  workflow_dispatch:
  push:
    branches:
      - reef-dream-v08-animated
    paths:
      - 'ReefDream-v08/**'
      - '.github/workflows/reef-dream.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: ReefDream-v08
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ReefDream-v08-Android9-APK
          path: ReefDream-v08/app/build/outputs/apk/debug/*.apk
